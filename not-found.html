<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索不到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: transparent;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .notfound-code {
            font-size: 36px;
            font-weight: 300;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .notfound-text {
            color: #666;
            font-size: 15px;
            margin-bottom: 24px;
        }

        a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .box {
                padding: 20px;
            }

            .notfound-code {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .notfound-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="notfound-code">抱歉，我们搜索不到</div>
        <div class="notfound-text">没有找到与 <span id="queryText"></span> 相关的内容</div>
        <a href="index.html">返回搜索</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        document.getElementById('queryText').textContent = '"' + query + '"';
    </script>

</body>
</html>
