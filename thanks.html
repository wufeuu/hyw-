<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致谢</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;

            margin-bottom: 16px;
        }

            line-height: 1.6;

        }

        .list {
            text-align: left;
            margin: 20px 0;
            padding: 16px;
            background: #fafafa;
            font-size: 14px;
        }

        .list div {
            margin-bottom: 8px;
        }

        .list span {
            color: #999;
        }

        .donate {
            margin: 16px 0;
            padding: 12px;
            background: #fff8e1;
            font-size: 13px;
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
