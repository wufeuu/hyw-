<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        /* 全屏场景 */
        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #fff;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 对话框 */
        .dialogue-box {
            position: absolute;
            bottom: 60px;
            left: 20px;
            right: 20px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px 24px;
            min-height: 120px;
        }

        .speaker-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.7;
            color: #000;
        }

        /* 输入区域 */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .input-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .text-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .text-input::placeholder {
            color: #999;
        }

        .text-input:focus {
            border-color: #999;
        }

        .send-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .send-btn:hover {
            background: #555;
        }

        /* 对话历史 */
        .history-log {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        .history-toggle {
            color: #999;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .history-toggle:hover {
            color: #333;
        }

        .history-panel {
            display: none;
            position: absolute;
            top: 28px;
            right: 0;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            color: #333;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .history-panel.show {
            display: block;
        }

        .history-panel .log-speaker {
            color: #333;
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .history-panel .log-text {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        /* 输入区域 */
        .input-area {
            position: absolute;
            bottom: 0;
            right: 0;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #eee;
            border-left: 1px solid #eee;
            display: none;
        }

        .input-area.show {
            display: flex;
        }

        .input-box {
            display: flex;
            gap: 8px;
        }

        .text-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .text-input:focus {
            border-color: #999;
        }

        .send-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .send-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="history-log">
            <button class="history-toggle" onclick="toggleHistory()">记录</button>
            <div class="history-panel" id="historyPanel"></div>
        </div>

        <div class="dialogue-box">
            <div class="speaker-name" id="speakerName">???</div>
            <div class="dialogue-text" id="dialogueText"></div>
        </div>

        <div class="input-area" id="inputArea">
            <div class="input-box">
                <input type="text" class="text-input" id="textInput" placeholder="输入名称..." autocomplete="off"/>
                <button class="send-btn" id="sendBtn">确定</button>
            </div>
        </div>

    <script>
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const historyPanel = document.getElementById('historyPanel');
        const inputArea = document.getElementById('inputArea');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');

        let log = [];
        let isTyping = false;
        let hasStarted = false;
        let step = 0;
        let waitingInput = false;
        let inputCount = 0;

        // 对话剧本（2号~8号）
        const script = [
            { speaker: '???', text: '我们认识吗?或者是你认识■吗?' },      // 2号
            { speaker: '???', text: '.......' },                           // 3号
            { speaker: '???', text: '你好像说不了话' },                     // 4号
            { speaker: '???', text: '等等 我知道了。' },                    // 5号
            { speaker: '???', text: '你知道我的名字不' },                   // 6号
            { speaker: '???', text: '猜一猜' },                            // 7号
            { speaker: '???', text: '（输入名称...）' }                    // 8号 → 弹出输入框
        ];

        // 输入错误后的对话（9号~10号）
        const wrongScript = [
            { speaker: '???', text: '...你都不认识我为什么来这里..你甚至不认识■' },  // 9号
            { speaker: '???', text: '滚去了解她再来和我说话' }                        // 10号 → 黑屏跳转
        ];
        let wrongStep = 0;

        // 输入"停"后的对话
        const tingScript = [
            { speaker: '???', text: '对了..' },                    // 文本1
            { speaker: '???', text: '个蛋，' },                    // 文本2
            { speaker: '???', text: '哎我也希望我是他。' },         // 文本3
            { speaker: '???', text: '你看上去对我有一些了解但不多，去认真看看吧' }  // 文本4 → 黑屏跳转
        ];
        let tingStep = 0;

        // 输入"幻想停"后的对话
        const correctScript = [
            { speaker: '幻想停', text: '答对了！好吧我承认你了解她了' },
            { speaker: '幻想停', text: '你想知道什么? 我会帮助你，哦对我记得她的博客可以把我移动过去，只要你记住我的网址然后在左边有一个注入角色那个输入框把我的网址输入进去我就可以帮助你了' }
        ];
        let correctStep = 0;

        // 打字机效果
        function typeWriter(text, callback) {
            isTyping = true;
            dialogueText.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    dialogueText.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 80);
                } else {
                    isTyping = false;
                    if (callback) callback();
                }
            }
            type();
        }

        // 1号文本：页面加载后1秒自动显示"哦！"
        window.addEventListener('load', () => {
            setTimeout(() => {
                dialogueText.textContent = '哦！';
                log.push({ speaker: '???', text: '哦！' });
                updateHistory();
            }, 1000);
        });

        // 点击推进对话（2号起）
        document.addEventListener('click', (e) => {
            if (waitingInput) return;
            if (isTyping) return;
            if (e.target.closest('.input-area')) return;

            // 错误对话推进（9号~10号）
            if (wrongStep > 0 && wrongStep <= wrongScript.length) {
                if (wrongStep < wrongScript.length) {
                    const line = wrongScript[wrongStep];
                    typeWriter(line.text, () => {
                        log.push({ speaker: line.speaker, text: line.text });
                        updateHistory();
                        wrongStep++;
                        // 10号说完：黑屏跳转
                        if (wrongStep >= wrongScript.length) {
                            fadeToSearch();
                        }
                    });
                }
                return;
            }

            // "停"路线对话推进
            if (tingStep > 0 && tingStep <= tingScript.length) {
                if (tingStep < tingScript.length) {
                    const line = tingScript[tingStep];
                    typeWriter(line.text, () => {
                        log.push({ speaker: line.speaker, text: line.text });
                        updateHistory();
                        tingStep++;
                        // 文本4说完：黑屏跳转
                        if (tingStep >= tingScript.length) {
                            fadeToSearch();
                        }
                    });
                }
                return;
            }

            // "幻想停"路线对话推进
            if (correctStep > 0 && correctStep <= correctScript.length) {
                if (correctStep < correctScript.length) {
                    const line = correctScript[correctStep];
                    typeWriter(line.text, () => {
                        log.push({ speaker: line.speaker, text: line.text });
                        updateHistory();
                        correctStep++;
                    });
                }
                return;
            }

            if (!hasStarted) {
                hasStarted = true;
                // 2号文本
                typeWriter(script[0].text, () => {
                    log.push({ speaker: '???', text: script[0].text });
                    updateHistory();
                    step = 1;
                });
            } else if (step < script.length) {
                const line = script[step];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    updateHistory();
                    step++;
                    // 8号说完：弹出输入框
                    if (step >= script.length) {
                        waitingInput = true;
                        inputArea.classList.add('show');
                        textInput.focus();
                    }
                });
            }
        });

        // 输入名称
        sendBtn.addEventListener('click', submitName);
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitName();
        });

        function submitName() {
            const name = textInput.value.trim();
            if (!name) return;

            inputArea.classList.remove('show');
            waitingInput = false;
            textInput.value = '';

            log.push({ speaker: '你', text: name });
            updateHistory();

            // 正确答案：幻想停
            if (name === '幻想停') {
                speakerName.textContent = '幻想停';
                typeWriter(correctScript[0].text, () => {
                    log.push({ speaker: '???', text: correctScript[0].text });
                    updateHistory();
                    correctStep = 1;
                });
                return;
            }

            // 输入"停"
            if (name === '停') {
                typeWriter(tingScript[0].text, () => {
                    log.push({ speaker: '???', text: tingScript[0].text });
                    updateHistory();
                    tingStep = 1;
                });
                return;
            }

            // 错误名字 → 9号文本
            typeWriter(wrongScript[0].text, () => {
                log.push({ speaker: '???', text: wrongScript[0].text });
                updateHistory();
                wrongStep = 1;
            });
        }

        // 黑屏跳转到搜索页
        function fadeToSearch() {
            setTimeout(() => {
                document.querySelector('.scene').style.transition = 'opacity 1s';
                document.querySelector('.scene').style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }, 500);
        }

        function showDialogue(speaker, text) {
            speakerName.textContent = speaker;
            typeWriter(text, () => {
                log.push({ speaker: speaker, text: text });
                updateHistory();
            });
        }

        function toggleHistory() {
            historyPanel.classList.toggle('show');
        }

        function updateHistory() {
            historyPanel.innerHTML = log.map(item =>
                '<div class="log-speaker">' + item.speaker + '</div>' +
                '<div class="log-text">' + item.text + '</div>'
            ).join('');
            historyPanel.scrollTop = historyPanel.scrollHeight;
        }
    </script>

</body>
</html>
