<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        /* 全屏场景 */
        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #fff;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 主对话框容器 */
        .main-box {
            position: absolute;
            bottom: 60px;
            left: 20px;
            right: 20px;
        }

        /* 输入框（在右上角） */
        .input-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            display: none;
        }

        .input-box.show {
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 2px solid #333;
            border-radius: 4px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .input-field::placeholder {
            color: #999;
        }

        /* 对话框 */
        .dialogue-box {
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px 24px;
            min-height: 120px;
            margin-top: 40px;
        }

        .speaker-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.7;
            color: #000;
        }

        /* 对话历史 */
        .history-log {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        .history-toggle {
            color: #999;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .history-toggle:hover {
            color: #333;
        }

        .history-panel {
            display: none;
            position: absolute;
            top: 28px;
            right: 0;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            color: #333;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .history-panel.show {
            display: block;
        }

        .history-panel .log-speaker {
            color: #333;
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .history-panel .log-text {
            margin-bottom: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="history-log">
            <button class="history-toggle" onclick="toggleHistory()">记录</button>
            <div class="history-panel" id="historyPanel"></div>
        </div>

        <div class="main-box">
            <!-- 输入框（在右上角） -->
            <div class="input-box" id="inputBox">
                <input type="text" class="input-field" id="inputField" placeholder="..." autocomplete="off"/>
            </div>

            <!-- 对话框 -->
            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">???</div>
                <div class="dialogue-text" id="dialogueText"></div>
            </div>
        </div>

    <script>
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const historyPanel = document.getElementById('historyPanel');
        const inputBox = document.getElementById('inputBox');
        const inputField = document.getElementById('inputField');

        let log = [];
        let isTyping = false;
        let step = 0;
        let canInput = false;
        let hasVisited = localStorage.getItem('ting_visited') === 'true';
        let savedLog = JSON.parse(localStorage.getItem('ting_log') || '[]');

        // 首次访问对话剧本
        const script = [
            { speaker: '???', text: '哦！' },                                              // 1号
            { speaker: '???', text: '我们认识吗?' },                                        // 2号
            { speaker: '???', text: '或者是你认识■吗?' },                                   // 3号
            { speaker: '???', text: '.......' },                                          // 4号
            { speaker: '???', text: '你好像说不了话' },                                      // 5号
            { speaker: '???', text: '等等 我知道了。' },                                     // 6号
            { speaker: '???', text: '.....' },                                            // 7号
            { speaker: '???', text: '看见右边那个输入框了没 我特意设计给你的' },               // 8号
            { speaker: '???', text: '因为我是■特意创造出来的人' },                          // 9号
            { speaker: '???', text: 'sooooooo......' },                                   // 10号
            { speaker: '???', text: '你知道的想要我帮助你得回答我的一个小小问题' },             // 11号
            { speaker: '???', text: '你知道我是谁吗？' }                                    // 12号 → 可以输入了
        ];

        // 错误输入后的对话
        const wrongScript = [
            { speaker: '???', text: '...' },                                                              // 1号
            { speaker: '???', text: '..well 这证明了你还没了解我和■' },                                      // 2号
            { speaker: '???', text: '滚去了解 http://xiaoyi.blogroom.net 再来和我说话' }                     // 3号 → 返回搜索
        ];
        let wrongStep = 0;

        // 再次访问对话
        const returnScript = [
            { speaker: '???', text: '欢迎回来' },                                          // 1号
            { speaker: '???', text: '对我的名字有头绪了吗？' }                               // 2号 → 可以输入了
        ];

        // 正确答案：幻想停
        const correctScript = [
            { speaker: '幻想停', text: '答对了！好吧我承认你了解她了' },
            { speaker: '幻想停', text: '你想知道什么? 我会帮助你，哦对我记得她的博客可以把我移动过去，只要你记住我的网址然后在左边有一个注入角色那个输入框把我的网址输入进去我就可以帮助你了' }
        ];
        let correctStep = 0;

        // 打字机效果
        function typeWriter(text, callback) {
            isTyping = true;
            dialogueText.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    dialogueText.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 80);
                } else {
                    isTyping = false;
                    if (callback) callback();
                }
            }
            type();
        }

        // 保存记录
        function saveLog() {
            localStorage.setItem('ting_log', JSON.stringify(log));
        }

        // 加载历史记录
        function loadHistory() {
            if (savedLog.length > 0) {
                log = savedLog;
                updateHistory();
            }
        }

        // 点击推进对话
        document.addEventListener('click', (e) => {
            if (e.target.closest('.history-log')) return;
            if (e.target === inputField) return;
            if (document.activeElement === inputField) return;

            // 错误对话推进
            if (wrongStep > 0) {
                if (wrongStep < wrongScript.length) {
                    const line = wrongScript[wrongStep];
                    typeWriter(line.text, () => {
                        log.push({ speaker: line.speaker, text: line.text });
                        updateHistory();
                        saveLog();
                        wrongStep++;
                        // 3号说完：返回搜索
                        if (wrongStep >= wrongScript.length) {
                            fadeToSearch();
                        }
                    });
                }
                return;
            }

            // 正确路线对话推进
            if (correctStep > 0) {
                if (correctStep < correctScript.length) {
                    const line = correctScript[correctStep];
                    typeWriter(line.text, () => {
                        log.push({ speaker: line.speaker, text: line.text });
                        updateHistory();
                        saveLog();
                        correctStep++;
                    });
                }
                return;
            }

            // 等待输入时不能推进
            if (canInput) return;

            // 打字中不能推进
            if (isTyping) return;

            // 再次访问
            if (hasVisited && step === 0) {
                const line = returnScript[step];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    updateHistory();
                    saveLog();
                    step++;
                });
            } else if (hasVisited && step < returnScript.length) {
                const line = returnScript[step];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    updateHistory();
                    saveLog();
                    step++;
                    // 2号说完：可以输入了
                    if (step >= returnScript.length) {
                        canInput = true;
                        inputBox.classList.add('show');
                        inputField.placeholder = '输入...';
                        inputField.focus();
                    }
                });
            }
            // 首次访问
            else if (!hasVisited && step < script.length) {
                const line = script[step];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    updateHistory();
                    saveLog();
                    step++;

                    // 8号说完：显示输入框
                    if (step === 8) {
                        inputBox.classList.add('show');
                        inputField.placeholder = '...';
                        canInput = false;
                    }

                    // 12号说完：可以输入了
                    if (step >= script.length) {
                        canInput = true;
                        inputField.placeholder = '输入...';
                        inputField.focus();
                    }
                });
            }
        });

        // 输入框回车提交
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const name = inputField.value.trim();
                if (!name) return;

                log.push({ speaker: '你', text: name });
                updateHistory();
                saveLog();
                inputField.value = '';

                // 输入完名字后输入框消失
                inputBox.classList.remove('show');
                canInput = false;

                // 标记已访问
                localStorage.setItem('ting_visited', 'true');

                if (name === '幻想停') {
                    speakerName.textContent = '幻想停';
                    typeWriter(correctScript[0].text, () => {
                        log.push({ speaker: '幻想停', text: correctScript[0].text });
                        updateHistory();
                        saveLog();
                        correctStep = 1;
                    });
                } else {
                    // 错误名字 → 显示 "..."
                    typeWriter(wrongScript[0].text, () => {
                        log.push({ speaker: '???', text: wrongScript[0].text });
                        updateHistory();
                        saveLog();
                        wrongStep = 1;
                    });
                }
            }
        });

        // 返回搜索页
        function fadeToSearch() {
            setTimeout(() => {
                document.querySelector('.scene').style.transition = 'opacity 1s';
                document.querySelector('.scene').style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }, 500);
        }

        function toggleHistory() {
            historyPanel.classList.toggle('show');
        }

        function updateHistory() {
            historyPanel.innerHTML = log.map(item =>
                '<div class="log-speaker">' + item.speaker + '</div>' +
                '<div class="log-text">' + item.text + '</div>'
            ).join('');
            historyPanel.scrollTop = historyPanel.scrollHeight;
        }

        // 页面加载
        loadHistory();
    </script>

</body>
</html>
