<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        /* 全屏场景 */
        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #fff;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 左上角返回 */
        .back-link {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 13px;
            color: #999;
            text-decoration: none;
            z-index: 10;
        }

        .back-link:hover {
            color: #333;
        }

        /* 主对话框容器 */
        .main-box {
            position: absolute;
            bottom: 60px;
            left: 20px;
            right: 20px;
        }

        /* 输入框（在右上角） */
        .input-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            display: none;
        }

        .input-box.show {
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 2px solid #333;
            border-radius: 4px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .input-field::placeholder {
            color: #999;
        }

        /* 对话框 */
        .dialogue-box {
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px 24px;
            min-height: 120px;
            margin-top: 40px;
        }

        .speaker-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.7;
            color: #000;
        }

        /* 对话历史 */
        .history-log {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        .history-toggle {
            color: #999;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .history-toggle:hover {
            color: #333;
        }

        .history-panel {
            display: none;
            position: absolute;
            top: 28px;
            right: 0;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            color: #333;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .history-panel.show {
            display: block;
        }

        .history-panel .log-speaker {
            color: #333;
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .history-panel .log-text {
            margin-bottom: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="scene">
        <a href="index.html" class="back-link">← 返回</a>

        <div class="history-log">
            <button class="history-toggle" onclick="toggleHistory()">记录</button>
            <div class="history-panel" id="historyPanel"></div>
        </div>

        <div class="main-box">
            <!-- 输入框（在右上角） -->
            <div class="input-box" id="inputBox">
                <input type="text" class="input-field" id="inputField" placeholder="..." autocomplete="off"/>
            </div>

            <!-- 对话框 -->
            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">???</div>
                <div class="dialogue-text" id="dialogueText"></div>
            </div>
        </div>

    <script>
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const historyPanel = document.getElementById('historyPanel');
        const inputBox = document.getElementById('inputBox');
        const inputField = document.getElementById('inputField');

        let log = [];
        let isTyping = false;
        let step = 0;
        let canInput = false;
        let currentSpeaker = '???';

        // 检查是否知道名字
        let knownName = localStorage.getItem('ting_known_name');
        if (knownName) {
            currentSpeaker = knownName;
        }

        // 检查是否从huanxiang返回
        let fromHuanxiang = localStorage.getItem('ting_from_huanxiang') === 'true';
        if (fromHuanxiang) {
            localStorage.removeItem('ting_from_huanxiang');
        }

        // 恢复历史记录
        const savedLog = localStorage.getItem('ting_log');
        if (savedLog) {
            log = JSON.parse(savedLog);
        }

        // 首次访问的对话剧本
        const script = [
            { speaker: '???', text: '哦！' },
            { speaker: '???', text: '我们认识吗?' },
            { speaker: '???', text: '或者是你认识■吗?' },
            { speaker: '???', text: '.......' },
            { speaker: '???', text: '你好像说不了话' },
            { speaker: '???', text: '等等 我知道了。' },
            { speaker: '???', text: '.....' },
            { speaker: '???', text: '看见右边那个输入框了没 我特意设计给你的' },
            { speaker: '???', text: '因为我是■特意创造出来的人' },
            { speaker: '???', text: 'sooooooo......' },
            { speaker: '???', text: '你知道的想要我帮助你得回答我的一个小小问题' },
            { speaker: '???', text: '你知道我是谁吗？' }
        ];

        // 错误输入后的对话
        const wrongScript = [
            { speaker: '???', text: '蠢货' },
            { speaker: '???', text: '滚去 http://xiaoyi.blogroom.net 好好看看 再来和我说话' }
        ];
        let wrongStep = 0;
        let wrongFinished = false;

        // 播放错误对话（自动播放）
        function playWrongDialogue() {
            if (wrongStep < wrongScript.length) {
                const line = wrongScript[wrongStep];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    wrongStep++;
                    if (wrongStep < wrongScript.length) {
                        setTimeout(playWrongDialogue, 800);
                    } else {
                        wrongFinished = true;
                    }
                });
            }
        }

        // "停"支线对话
        const stopScript = [
            { speaker: '???', text: '对了..个屁' },
            { speaker: '???', text: '...' },
            { speaker: '???', text: '唉凭什么我不是他呢', small: true },
            { speaker: '???', text: '你看上去有一些了解但不多，去 http://xiaoyi.blogroom.net 在认真看看吧' }
        ];
        let stopStep = 0;
        let stopFinished = false;

        // 播放"停"支线对话（自动播放）
        function playStopDialogue() {
            if (stopStep < stopScript.length) {
                const line = stopScript[stopStep];
                const isSmall = line.small;
                dialogueText.style.fontSize = isSmall ? '12px' : '15px';
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    dialogueText.style.fontSize = '15px';
                    stopStep++;
                    if (stopStep < stopScript.length) {
                        setTimeout(playStopDialogue, 800);
                    } else {
                        stopFinished = true;
                    }
                });
            }
        }

        // 正确答案：幻想停
        const correctScript = [
            { speaker: '幻想停', text: '答对了！好吧' },
            { speaker: '幻想停', text: '.....' },
            { speaker: '幻想停', text: '我会帮助你，我记得她的博客可以把我移动过去，只要你记住我的网址然后在有一个注入角色那个输入框把我的网址输入进去' },
            { speaker: '幻想停', text: '明白吗？' },
            { speaker: '幻想停', text: '现在快去' }
        ];
        let correctStep = 0;

        // 播放正确路线对话（自动播放）
        function playCorrectDialogue() {
            if (correctStep < correctScript.length) {
                const line = correctScript[correctStep];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    correctStep++;
                    if (correctStep < correctScript.length) {
                        setTimeout(playCorrectDialogue, 800);
                    }
                });
            }
        }

        // 从huanxiang返回的对话剧本
        const huanxiangReturnScript = [
            { speaker: '幻想停', text: '你怎么又来我房间了' },
            { speaker: '幻想停', text: '.....' },
            { speaker: '幻想停', text: '算了...你在这里想呆多久就多久吧' },
            { speaker: '幻想停', text: '....（沉默）' }
        ];
        let huanxiangReturnStep = 0;

        // 播放从huanxiang返回的对话（自动播放）
        function playHuanxiangReturnDialogue() {
            if (huanxiangReturnStep < huanxiangReturnScript.length) {
                const line = huanxiangReturnScript[huanxiangReturnStep];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    huanxiangReturnStep++;
                    if (huanxiangReturnStep < huanxiangReturnScript.length) {
                        setTimeout(playHuanxiangReturnDialogue, 800);
                    }
                });
            }
        }

        // 已知名字后的对话剧本
        const knownNameScript = [
            { speaker: currentSpeaker, text: '欢迎回来' },
            { speaker: currentSpeaker, text: '对我的名字有头绪了吗？' },
            { speaker: currentSpeaker, text: '.....' }
        ];
        let knownNameStep = 0;

        // 保存对话记录
        function saveLog() {
            localStorage.setItem('ting_log', JSON.stringify(log));
        }

        // 打字机效果
        function typeWriter(text, callback) {
            isTyping = true;
            dialogueText.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    dialogueText.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 80);
                } else {
                    isTyping = false;
                    if (callback) callback();
                }
            }
            type();
        }

        // 点击推进对话
        document.addEventListener('click', (e) => {
            if (e.target.closest('.history-log')) return;
            if (e.target === inputField) return;
            if (document.activeElement === inputField) return;

            // 错误对话：播放完最后一段后才可点击返回
            if (wrongStep > 0 || wrongFinished) {
                if (wrongFinished) {
                    window.location.href = 'index.html';
                }
                return;
            }

            // "停"支线：播放完最后一段后才可点击返回
            if (stopStep > 0 || stopFinished) {
                if (stopFinished) {
                    window.location.href = 'index.html';
                }
                return;
            }

            // 从huanxiang返回的对话：播放完最后一段后不可返回
            if (huanxiangReturnStep > 0 || fromHuanxiang) {
                if (huanxiangReturnStep >= huanxiangReturnScript.length) {
                    // 播放完了，不跳转
                }
                return;
            }

            // 已知名字的对话：自动播放，播放完后显示输入框
            if (knownName && knownNameStep < knownNameScript.length) {
                if (isTyping) return;
                const line = knownNameScript[knownNameStep];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    knownNameStep++;
                    if (knownNameStep >= knownNameScript.length) {
                        canInput = true;
                        inputBox.classList.add('show');
                        inputField.placeholder = '输入...';
                        inputField.focus();
                    }
                });
                return;
            }

            // 正确路线：播放完点击跳转新页面
            if (correctStep > 0) {
                if (correctStep >= correctScript.length) {
                    localStorage.setItem('ting_from_huanxiang', 'true');
                    window.location.href = 'huanxiang.html';
                }
                return;
            }

            // 等待输入时不能推进
            if (canInput) return;

            // 打字中不能推进
            if (isTyping) return;

            // 首次访问的对话推进
            if (step < script.length) {
                const line = script[step];
                typeWriter(line.text, () => {
                    log.push({ speaker: line.speaker, text: line.text });
                    saveLog();
                    updateHistory();
                    step++;

                    // 12号说完：显示输入框
                    if (step >= script.length) {
                        canInput = true;
                        inputBox.classList.add('show');
                        inputField.placeholder = '输入...';
                        inputField.focus();
                    }
                });
            }
        });

        // 输入框回车提交
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const name = inputField.value.trim();
                if (!name) return;

                log.push({ speaker: '你', text: name });
                saveLog();
                updateHistory();
                inputField.value = '';
                inputBox.classList.remove('show');

                if (name === '幻想停') {
                    // 保存已知名字
                    localStorage.setItem('ting_known_name', '幻想停');
                    currentSpeaker = '幻想停';
                    speakerName.textContent = '幻想停';
                    correctStep = 0;
                    playCorrectDialogue();
                } else if (name === '停') {
                    stopStep = 0;
                    stopFinished = false;
                    playStopDialogue();
                } else {
                    wrongStep = 0;
                    wrongFinished = false;
                    playWrongDialogue();
                }
            }
        });

        // 页面加载时检查状态
        window.addEventListener('load', () => {
            // 如果已知道名字，播放"你怎么又来我房间了"剧本
            if (knownName) {
                speakerName.textContent = currentSpeaker;
                huanxiangReturnStep = 0;
                playHuanxiangReturnDialogue();
            }

            // 更新历史记录
            updateHistory();
        });

        function toggleHistory() {
            historyPanel.classList.toggle('show');
        }

        function updateHistory() {
            historyPanel.innerHTML = log.map(item =>
                '<div class="log-speaker">' + item.speaker + '</div>' +
                '<div class="log-text">' + item.text + '</div>'
            ).join('');
            historyPanel.scrollTop = historyPanel.scrollHeight;
        }
    </script>

</body>
</html>
