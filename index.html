<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: transparent;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 36px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 80px 12px 16px;
            font-size: 15px;
            border: 1px solid #ddd;
            outline: none;
        }

        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: #333;
            color: #fff;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="logo">Search</div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="输入搜索内容..." autocomplete="off"/>
            <button class="search-btn" onclick="doSearch()">搜索</button>
        </div>
    </div>

    <script>
        const allowedKeywords = ['致谢名单'];

        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const isAllowed = allowedKeywords.some(k => query.toLowerCase() === k.toLowerCase());

            if (isAllowed) {
                window.location.href = 'thanks.html';
            } else {
                window.location.href = 'not-found.html?q=' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });
    </script>

</body>
</html>
