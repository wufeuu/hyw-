<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: transparent;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 36px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 80px 12px 16px;
            font-size: 15px;
            border: 1px solid #ddd;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: #333;
            color: #fff;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }

        /* 历史搜索 */
        .history {
            text-align: left;
            margin-top: 20px;
            display: none;
        }

        .history.show {
            display: block;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-title {
            font-size: 13px;
            color: #999;
        }

        .history-clear {
            font-size: 12px;
            color: #1a73e8;
            background: none;
            border: none;
            cursor: pointer;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            background: #fff;
            border: 1px solid #ddd;
            padding: 6px 14px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-radius: 4px;
        }

        .history-item:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="logo">Search</div>
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入搜索网站..." autocomplete="off"/>
                <button class="search-btn" onclick="doSearch()">搜索</button>
            </div>

            <div class="history" id="historySection">
                <div class="history-header">
                    <span class="history-title">搜索历史</span>
                    <button class="history-clear" onclick="clearHistory()">清除</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        const allowedKeywords = {
            '致谢名单': 'thanks.html',
            '听': 'ting.html',
            'http://yi.myfantasy.net/ting': 'ting.html',
            'http://xiaoyi.blogroom.net': 'huanxiang.html'
        };
        const MAX_HISTORY = 10;

        // 从 localStorage 获取历史
        function getHistory() {
            return JSON.parse(localStorage.getItem('searchHistory') || '[]');
        }

        // 保存历史
        function saveHistory(query) {
            let history = getHistory();
            history = history.filter(item => item !== query);
            history.unshift(query);
            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        }

        // 渲染历史
        function renderHistory() {
            const history = getHistory();
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');

            if (history.length === 0) {
                section.classList.remove('show');
                return;
            }

            section.classList.add('show');
            list.innerHTML = history.map(item =>
                '<div class="history-item" onclick="searchFromHistory(\'' + item + '\')">' + item + '</div>'
            ).join('');
        }

        // 从历史点击搜索
        function searchFromHistory(query) {
            document.getElementById('searchInput').value = query;
            doSearch();
        }

        // 清除历史
        function clearHistory() {
            localStorage.removeItem('searchHistory');
            renderHistory();
        }

        // 搜索
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // 保存历史
            saveHistory(query);

            const isAllowed = allowedKeywords.hasOwnProperty(query.toLowerCase()) || allowedKeywords.hasOwnProperty(query);

            if (isAllowed) {
                const page = allowedKeywords[query.toLowerCase()] || allowedKeywords[query];
                window.location.href = page;
            } else {
                window.location.href = 'not-found.html?q=' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // 页面加载时显示历史
        renderHistory();
    </script>

</body>
</html>
