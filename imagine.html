<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        /* 全屏场景 */
        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #fff;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 左上角返回 */
        .back-link {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 13px;
            color: #999;
            text-decoration: none;
            z-index: 10;
        }

        .back-link:hover {
            color: #333;
        }

        /* 主对话框容器 */
        .main-box {
            position: absolute;
            bottom: 150px;
            left: 20px;
            right: 20px;
        }

        /* 输入框（在右上角） */
        .input-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            display: none;
        }

        .input-box.show {
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 2px solid #333;
            border-radius: 4px;
            outline: none;
            background: #fff;
            color: #000;
        }

        .input-field::placeholder {
            color: #999;
        }

        /* 对话框 */
        .dialogue-box {
            background: #fff;
            border: 2px solid #333;
            padding: 15px;
            min-height: 200px;
            margin-top: 40px;
            position: relative;
        }

        .speaker-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.7;
            color: #000;
        }

        /* 三角形按钮 */
        .skip-btn {
            position: absolute;
            bottom: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            user-select: none;
            display: none;
        }

        .skip-btn:hover {
            color: #666;
        }

        /* 对话历史 */
        .history-log {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        .history-toggle {
            color: #999;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .history-toggle:hover {
            color: #333;
        }

        .history-panel {
            display: none;
            position: absolute;
            top: 28px;
            right: 0;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            color: #333;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .history-panel.show {
            display: block;
        }

        .history-panel .log-speaker {
            color: #333;
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .history-panel .log-text {
            margin-bottom: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="scene">
        <a href="index.html" class="back-link">← 返回</a>

        <div class="history-log">
            <button class="history-toggle" onclick="toggleHistory()">记录</button>
            <div class="history-panel" id="historyPanel"></div>
        </div>

        <div class="main-box">
            <!-- 输入框（在右上角） -->
            <div class="input-box" id="inputBox">
                <input type="text" class="input-field" id="inputField" placeholder="..." autocomplete="off"/>
            </div>

            <!-- 对话框 -->
            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">???</div>
                <div class="dialogue-text" id="dialogueText"></div>
                <!-- 三角形按钮 -->
                <div class="skip-btn" id="skipBtn" onclick="nextDialogue()">▶</div>
            </div>
        </div>

    <script>
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const historyPanel = document.getElementById('historyPanel');
        const inputBox = document.getElementById('inputBox');
        const inputField = document.getElementById('inputField');
        const skipBtn = document.getElementById('skipBtn');

        let log = [];
        let isTyping = false;
        let canInput = false;
        let currentSpeaker = '???';

        // 当前剧本状态
        let currentScript = null;
        let currentStep = 0;
        let currentMode = 'main'; // main, firstWrong, repeatWrong, stop, correct, huanxiangReturn, return

        // 检查是否知道名字
        let knownName = localStorage.getItem('imagine_known_name');
        if (knownName) {
            currentSpeaker = knownName;
        }

        // 检查是否从huanxiang返回
        let fromHuanxiang = localStorage.getItem('imagine_from_huanxiang') === 'true';
        if (fromHuanxiang) {
            localStorage.removeItem('imagine_from_huanxiang');
        }

        // 检查错误次数
        let wrongCount = parseInt(localStorage.getItem('imagine_wrong_count') || '0');

        // 恢复历史记录
        const savedLog = localStorage.getItem('imagine_log');
        if (savedLog) {
            log = JSON.parse(savedLog);
        }

        // 各种剧本
        const scripts = {
            main: [
                { speaker: '???', text: '哦！' },
                { speaker: '???', text: '我们认识吗?' },
                { speaker: '???', text: '或者是你认识■吗?' },
                { speaker: '???', text: '.......' },
                { speaker: '???', text: '你好像说不了话' },
                { speaker: '???', text: '等等 我知道了。' },
                { speaker: '???', text: '.....' },
                { speaker: '???', text: '看见右边那个输入框了没 我特意设计给你的' },
                { speaker: '???', text: '因为我是■特意创造出来的人' },
                { speaker: '???', text: 'sooooooo......' },
                { speaker: '???', text: '你知道的想要我帮助你得回答我的一个小小问题' },
                { speaker: '???', text: '你知道我是谁吗？' }
            ],
            firstWrong: [
                { speaker: '???', text: '...well 这证明了你还没了解我和■' },
                { speaker: '???', text: '滚去 http://xiaoyi.blogroom.net 了解 再来和我说话' }
            ],
            repeatWrong: [
                { speaker: '???', text: '蠢货' },
                { speaker: '???', text: '再滚去 http://xiaoyi.blogroom.net 好好看看 再来和我说话！' }
            ],
            stop: [
                { speaker: '???', text: '对了..个屁' },
                { speaker: '???', text: '...' },
                { speaker: '???', text: '唉凭什么我不是他呢', small: true },
                { speaker: '???', text: '你看上去有一些了解但不多，去 http://xiaoyi.blogroom.net 在认真看看吧' }
            ],
            correct: [
                { speaker: '幻想停', text: '答对了！好吧' },
                { speaker: '幻想停', text: '.....' },
                { speaker: '幻想停', text: '我会帮助你，我记得她的博客可以把我移动过去，只要你记住我的网址然后在有一个注入角色那个输入框把我的网址输入进去' },
                { speaker: '幻想停', text: '明白吗？' },
                { speaker: '幻想停', text: '现在快去' }
            ],
            huanxiangReturn: [
                { speaker: '幻想停', text: '你怎么又来我房间了' },
                { speaker: '幻想停', text: '.....' },
                { speaker: '幻想停', text: '算了...你在这里想呆多久就多久吧' },
                { speaker: '幻想停', text: '....（沉默）' }
            ],
            return: [
                { speaker: '???', text: '欢迎回来' },
                { speaker: '???', text: '对我的名字有头绪了吗？' }
            ]
        };

        // 保存对话记录
        function saveLog() {
            localStorage.setItem('imagine_log', JSON.stringify(log));
        }

        // 打字机效果
        function typeWriter(text, callback) {
            isTyping = true;
            dialogueText.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    dialogueText.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 80);
                } else {
                    isTyping = false;
                    if (callback) callback();
                }
            }
            type();
        }

        // 播放一段对话
        function playLine(line, callback) {
            if (line.speaker) {
                speakerName.textContent = line.speaker;
            }
            const isSmall = line.small;
            dialogueText.style.fontSize = isSmall ? '12px' : '15px';
            typeWriter(line.text, () => {
                log.push({ speaker: line.speaker || currentSpeaker, text: line.text });
                saveLog();
                updateHistory();
                dialogueText.style.fontSize = '15px';
                if (callback) callback();
            });
        }

        // 显示三角形按钮
        function showSkipBtn() {
            skipBtn.style.display = 'block';
        }

        // 隐藏三角形按钮
        function hideSkipBtn() {
            skipBtn.style.display = 'none';
        }

        // 下一段对话（点击三角形）
        function nextDialogue() {
            if (isTyping) return;
            if (!currentScript) return;

            hideSkipBtn();
            currentStep++;

            if (currentStep < currentScript.length) {
                playLine(currentScript[currentStep], () => {
                    // 每段说完后显示三角形
                    showSkipBtn();
                });
            } else {
                // 剧本播放完毕
                onScriptEnd();
            }
        }

        // 剧本播放完毕后的处理
        function onScriptEnd() {
            switch (currentMode) {
                case 'main':
                    // 显示输入框
                    canInput = true;
                    inputBox.classList.add('show');
                    inputField.placeholder = '输入...';
                    inputField.focus();
                    break;
                case 'firstWrong':
                case 'repeatWrong':
                case 'stop':
                    // 返回搜索页
                    window.location.href = 'index.html';
                    break;
                case 'correct':
                    // 跳转到huanxiang
                    localStorage.setItem('imagine_from_huanxiang', 'true');
                    window.location.href = 'huanxiang.html';
                    break;
                case 'huanxiangReturn':
                    // 什么都不做，停留在页面
                    break;
                case 'return':
                    // 显示输入框
                    canInput = true;
                    inputBox.classList.add('show');
                    inputField.placeholder = '输入...';
                    inputField.focus();
                    break;
            }
        }

        // 开始播放剧本
        function startScript(mode) {
            currentMode = mode;
            currentScript = scripts[mode];
            currentStep = 0;

            if (currentScript && currentScript.length > 0) {
                playLine(currentScript[0], () => {
                    // 第一段说完后显示三角形
                    showSkipBtn();
                });
            }
        }

        // 输入框回车提交
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const name = inputField.value.trim();
                if (!name) return;

                log.push({ speaker: '你', text: name });
                saveLog();
                updateHistory();
                inputField.value = '';
                inputBox.classList.remove('show');
                canInput = false;

                if (name === '幻想停') {
                    localStorage.setItem('imagine_known_name', '幻想停');
                    localStorage.setItem('imagine_wrong_count', '0');
                    currentSpeaker = '幻想停';
                    startScript('correct');
                } else if (name === '停') {
                    startScript('stop');
                } else {
                    wrongCount++;
                    localStorage.setItem('imagine_wrong_count', wrongCount.toString());
                    if (wrongCount === 1) {
                        startScript('firstWrong');
                    } else {
                        startScript('repeatWrong');
                    }
                }
            }
        });

        // 页面加载时检查状态
        window.addEventListener('load', () => {
            if (knownName) {
                speakerName.textContent = currentSpeaker;
                startScript('huanxiangReturn');
            } else if (wrongCount > 0) {
                startScript('return');
            } else {
                startScript('main');
            }
            updateHistory();
        });

        function toggleHistory() {
            historyPanel.classList.toggle('show');
        }

        function updateHistory() {
            historyPanel.innerHTML = log.map(item =>
                '<div class="log-speaker">' + item.speaker + '</div>' +
                '<div class="log-text">' + item.text + '</div>'
            ).join('');
            historyPanel.scrollTop = historyPanel.scrollHeight;
        }
    </script>

</body>
</html>
